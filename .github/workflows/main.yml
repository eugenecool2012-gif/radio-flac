name: Build Windows portable

# Portable radio-flac для Windows 10/11:
#   radio-flac-gui.exe — интерфейс (GTK4 + libadwaita + GStreamer)
#   radio-flac.exe     — консольный рекордер
#   ffmpeg.exe, ffprobe.exe
# Запуск: тег v* (создаст Release) или вручную из вкладки Actions.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      # Канонический рецепт MSYS2: update + install в одном шаге.
      # update: true обязателен — он обновляет keyring и базы pacman,
      # без него pacman на свежей установке падает на PGP-подписях.
      # UCRT64 вместо MINGW64: MINGW64 объявлен deprecated.
      - name: MSYS2 (UCRT64) + пакеты
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            p7zip
            unzip

      - name: Диагностика окружения
        run: |
          set -eux
          echo "MSYSTEM=$MSYSTEM"
          which python
          python --version
          python -c "import sys; print('prefix:', sys.prefix)"
          pkg-config --modversion gtk4 libadwaita-1 gstreamer-1.0
          python -c "import gi, sys; \
            gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); gi.require_version('Gst','1.0'); \
            from gi.repository import Gtk, Adw, Gst; \
            print('GTK', Gtk.get_major_version(), Gtk.get_minor_version()); \
            print('Adw', Adw.MAJOR_VERSION, Adw.MINOR_VERSION); \
            print('Gst', Gst.version_string())"

      - name: PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m PyInstaller --version

      - name: Подготовка entry-скриптов
        run: |
          cp radio-flac-gui radio_flac_gui.py
          cp radio-flac radio_flac_cli.py

      - name: Сборка GUI
        run: |
          python -m PyInstaller --noconfirm --clean radio-flac.spec

      - name: Сборка CLI
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console \
            --name radio-flac --exclude-module tkinter --exclude-module gi \
            radio_flac_cli.py

      - name: ffmpeg
        run: |
          curl -L --retry 3 -o ff.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          unzip -q ff.zip -d ff
          find ff -name 'ffmpeg.exe' -exec cp {} dist/ \;
          find ff -name 'ffprobe.exe' -exec cp {} dist/ \;
          ls -la dist/

      - name: Собрать portable zip
        run: |
          cp README.md dist/ || true
          cd dist
          7z a -tzip ../radio-flac-portable-windows.zip *
          cd ..
          ls -lh radio-flac-portable-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: radio-flac-portable-windows
          path: radio-flac-portable-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: radio-flac-portable-windows.zip
          generate_release_notes: true
